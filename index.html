<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最早的起源與發明</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:linear-gradient(160deg,#fff6e8,#eaf6e0);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:30px 20px}
h1{text-align:center;color:#5a8a3a;font-size:26px;margin-bottom:24px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.card{width:min(340px,100%);background:#fff;border-radius:20px;text-decoration:none;color:#4a3b2a;box-shadow:0 4px 16px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s;border:3px solid #f0e6d2;overflow:hidden;display:block}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.16)}
.cover{position:relative;aspect-ratio:16/9;background:#eef3e2;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .cover img{transform:scale(1.06)}
.card .body{padding:14px 16px 18px;text-align:center}
.card .nm{font-size:19px;font-weight:bold;color:#5a4632}
.navbtns{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.navbtn{display:inline-block;background:#7cb342;color:#fff;text-decoration:none;font-size:15px;font-weight:bold;padding:11px 22px;border-radius:26px;box-shadow:0 3px 0 #5c8f2c;transition:transform .12s,box-shadow .12s}
.navbtn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #5c8f2c}
.navbtn.alt{background:#f0a93b;box-shadow:0 3px 0 #c9871f}
.navbtn.alt:hover{box-shadow:0 5px 0 #c9871f}
</style>
</head>
<body>
<div class="wrap">
  <h1>最早的起源與發明</h1>
  <div class="grid">
    <a class="card" href="computer/">
      <div class="cover">
        <img src="computer/img/s1.jpg" alt="電腦">
      </div>
      <div class="body">
        <div class="nm">電腦</div>
      </div>
    </a>
  </div>
  <div class="navbtns">
    <a class="navbtn" href="https://sites.google.com/view/zongheziyuanwang/">回首頁</a>
    <a class="navbtn alt" href="https://sites.google.com/view/zongheziyuanwang/知識補給站">回知識補給站</a>
  </div>
</div>
</body>
</html>
